format = """
[╭─ ](bold #a89984)\
$os\
$directory\
$git_branch\
$git_status\
$c\
$rust\
$golang\
$nodejs\
$php\
$java\
$kotlin\
$haskell\
$python\
$ruby\
$docker_context\
$time\
$cmd_duration\
$line_break\
[╰─$character](bold #a89984) \
"""

[os]
disabled = false
format = "[$symbol]($style) "
style = "bold #d65d0e"

[os.symbols]
Arch = "󰣇"
EndeavourOS = ""

[directory]
style = "bold #83a598"
format = "[$path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = ""
style = "bold #b8bb26"
format = "[[ $symbol $branch ](fg:#282828 bg:#b8bb26)]($style)"

[git_status]
style = "bold #fb4934"
format = "[[($all_status$ahead_behind )](fg:#282828 bg:#fb4934)]($style)"

[cmd_duration]
min_time = 500
format = "[$duration]($style) "
style = "bold #d3869b"

[time]
disabled = false
time_format = "%I:%M %p"
format = "[  $time ](bold #fabd2f)"

[character]
success_symbol = "[❯](bold #b8bb26)"
error_symbol = "[❯](bold #fb4934)"
vimcmd_symbol = "[❮](bold #83a598)"
