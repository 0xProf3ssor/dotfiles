# -----------------------------
# GENERAL KEYBINDINGS
# -----------------------------
unbind r
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

set -g prefix C-b
set -g mouse on
setw -g mode-keys vi

set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# switch pane
bind-key -r k select-pane -U
bind-key -r j select-pane -D
bind-key -r h select-pane -L
bind-key -r l select-pane -R

# resize pane
bind-key -r H resize-pane -L 5
bind-key -r J resize-pane -D 5
bind-key -r K resize-pane -U 5
bind-key -r L resize-pane -R 5

# swap pane
bind-key -r C-k swap-pane -U
bind-key -r C-j swap-pane -D

# Popup Shell
bind-key -r C-p display-popup -w 80% -h 80% -E $SHELL

# Popup Lazygit
bind-key -r C-l display-popup -w 80% -h 80% -E "lazygit"

# -----------------------------
# STATUS BAR CONFIG
# -----------------------------

# move status line to top
set-option -g status-position top




# default terminal
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",foot-256color:Tc"
set-option -ga terminal-overrides ",xterm-256color:Tc"  # optional, for Alacritty




# -----------------------------
# STATUS BAR MODULES (THEMED)
# -----------------------------

# window name on the left
set -g status-left " "

# right-side modules:
set -g status-right ""

set -g status-left-length 100
set -g status-right-length 100

# -----------------------------
# LOAD GRUVBOX PLUGIN
# -----------------------------
set -g @tmux-gruvbox 'dark'
run ~/.config/tmux/plugins/tmux-gruvbox/gruvbox-tpm.tmux
